[package]
name = "nothing-bar"
version = "0.1.0"
edition = "2024"
description = "The nothing-os top bar: a Wayland layer-shell bar for Hyprland, drawn with tiny-skia."
license = "MIT"
publish = false

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
tiny-skia = "0.12"
ab_glyph = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
